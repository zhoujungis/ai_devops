name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_devops
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot_dev_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d ai_devops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: ai_devops
      DB_USER: copilot
      DB_PASSWORD: copilot_dev_pw
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      FIELD_ENCRYPTION_KEY: hSn56swUzys_6F0fDXBo2VRCbywjt2Zg4Jocx2RaJSc=
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Django system checks
        # `--database` matters: without a connection Django skips constraint and
        # index validation, which is how a misplaced Meta.index slips through.
        run: python manage.py check --database default

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        # Network-dependent tests are excluded by default via `-m 'not network'`.
        # The live git-host sync tests are opt-in only (`pytest -m network`) and
        # deliberately absent from CI: they would send real requests to GitHub on
        # every push, and cost the runner's anonymous API budget to prove
        # something the mocked provider tests already cover.
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
