name: Publish CLI

# Tag-triggered on purpose. Publishing on every push to main would either fail on
# a duplicate version or force auto-incrementing, and auto-incrementing ships
# unreviewed commits to users' machines. A tag is the point at which a version is
# meant to exist.
#
# One-time setup, which cannot be done from here:
#   1. create the project on PyPI (or reserve the name)
#   2. add a "pending publisher" for it:
#        Owner              zhoujungis
#        Repository         ai_devops
#        Workflow name      publish-cli.yml
#        Environment        pypi
#   3. create a `pypi` environment in the repo settings (this is what the
#      `environment:` key below refers to)
# After that there is no token anywhere: PyPI verifies the workflow's OIDC
# identity, so a leaked secret cannot publish and a fork cannot either.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify, but do not upload to PyPI
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy ai_devops_cli

      - name: Tests
        run: pytest

  build:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the packaged version
        # Without this a mistyped tag publishes a version whose number does not
        # match the tag, and the mistake is permanent: PyPI does not allow
        # re-uploading a version.
        working-directory: .
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, sys, tomllib

          version = tomllib.loads(
              pathlib.Path("cli/pyproject.toml").read_text()
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag v{tag} does not match cli/pyproject.toml version {version}")
          print(f"tag v{tag} matches the packaged version")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: cli/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The only permission publishing needs: lets the job mint the OIDC token
      # PyPI exchanges for a short-lived upload credential.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/

      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
