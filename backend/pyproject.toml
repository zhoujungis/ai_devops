[project]
name = "ai-devops-copilot"
version = "0.1.0"
description = "AI DevOps / QA Copilot - backend (Django + DRF + Celery + pgvector)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "drf-spectacular>=0.27",
    "pydantic>=2.9",
    "httpx>=0.27",
    # Prompt frontmatter is YAML; declared explicitly rather than relied on
    # transitively through drf-spectacular.
    "pyyaml>=6.0",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "types-django-filter>=24.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*", "services*"]

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations"

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "RUF", "SIM", "TID"]
# E501: black owns line length. RUF00x: ambiguous-unicode noise on non-ASCII content.
# RUF012: Django's `Meta` and DRF's view attributes are declarative class-level
# configuration that the framework reads and never mutates per instance; marking
# them ClassVar only fights django-stubs' TypedModelMeta for no benefit.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "RUF", "SIM", "TID"]
"config/settings/*.py" = ["F403", "F405"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = ["migrations/", "manage.py"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

# celery ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "billiard.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
# Every test here is a function. Disabling class collection stops pytest from
# trying to collect domain models and enums whose names legitimately begin with
# `Test` (TestCase, TestSuite, TestRun, ...).
python_classes = []
testpaths = ["tests", "apps"]
# `network` tests talk to a real git host, so they are opt-in: `pytest -m network`.
addopts = "-ra --strict-markers --strict-config -m 'not network'"
markers = [
    "network: talks to a real external service; select with `-m network`",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
