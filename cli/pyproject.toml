[project]
name = "ai-devops-copilot-cli"
version = "0.1.0"
description = "Terminal client (CLI + TUI) for the AI DevOps / QA Copilot API"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.85.0",
    "httpx>=0.27.0",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
copilot = "ai_devops_cli.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_devops_cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF", "SIM"]
# E501: line length is a formatting concern, and the help strings read better long.
# B008: typer.Option/Argument in a default is Typer's documented idiom; Annotated is
# equivalent but adds noise across a flat command surface.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
# typer / textual / rich ship partial or no stubs; the cost of stubbing them
# outweighs the benefit for a client whose job is to print JSON.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Textual's run_test() is async; auto mode avoids decorating every TUI test.
asyncio_mode = "auto"
