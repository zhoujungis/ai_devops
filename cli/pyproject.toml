[project]
name = "aidevops"
version = "0.2.0"
description = "Terminal client (CLI + TUI) for the AI DevOps / QA Copilot API"
# PyPI shows this as the project page. Without it the page says "the author of this
# package has not provided a project description" and readers have nothing to go on.
readme = "README.md"
# SPDX expression plus the file itself, so the wheel and sdist carry the licence text
# rather than only naming it. This is PEP 639, which needs setuptools>=77.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZhouJun" }]
keywords = ["devops", "qa", "cli", "code-review", "risk-analysis", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.85.0",
    "httpx>=0.27.0",
    "platformdirs>=4.2.0",
    # PEP 440 comparison for the update check. It arrives transitively today, but a
    # transitive dependency is not a promise, and version comparison is exactly the
    # kind of thing worth not hand-rolling.
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[project.scripts]
aidevops = "ai_devops_cli.main:app"

[project.urls]
Homepage = "https://github.com/zhoujungis/ai_devops"
Repository = "https://github.com/zhoujungis/ai_devops"
Issues = "https://github.com/zhoujungis/ai_devops/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_devops_cli*"]

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------
# Same line length as the backend, so a reader moving between the two does not
# have to re-learn where lines break.
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF", "SIM"]
# E501: line length is a formatting concern, and the help strings read better long.
# B008: typer.Option/Argument in a default is Typer's documented idiom; Annotated is
# equivalent but adds noise across a flat command surface.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
# typer / textual / rich ship partial or no stubs; the cost of stubbing them
# outweighs the benefit for a client whose job is to print JSON.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Textual's run_test() is async; auto mode avoids decorating every TUI test.
asyncio_mode = "auto"
